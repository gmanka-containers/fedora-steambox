on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: '0 7 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: redhat-actions/buildah-build@v3
        with:
          tags: quay.io/gmanka/fedora-steambox:latest
          containerfiles: |
            Containerfile
      - name: quay.io
        uses: redhat-actions/push-to-registry@v3
        with:
          tags: quay.io/gmanka/fedora-steambox:latest
          registry: quay.io/gmanka
          username: gmankab
          password: ${{ secrets.QUAY_TOKEN }}

